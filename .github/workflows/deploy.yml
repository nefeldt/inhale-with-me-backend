name: Build & Deploy to mittwald

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires a lowercase image name; the repo/owner may contain uppercase.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY@L}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy stack to mittwald
        uses: mittwald/deploy-container-action@v1
        env:
          IMAGE_TAG: ${{ env.IMAGE }}:${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # APNs push (optional — leave the secrets unset to run without push).
          APNS_KEY_P8_BASE64: ${{ secrets.APNS_KEY_P8_BASE64 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_PRODUCTION: "true"
        with:
          api_token: ${{ secrets.MITTWALD_API_TOKEN }}
          # Accept the stack id under either common name, from Secrets or Variables.
          stack_id: ${{ secrets.STACK_ID || secrets.MITTWALD_STACK_ID || vars.STACK_ID || vars.MITTWALD_STACK_ID }}
          stack_file: ${{ github.workspace }}/deploy/stack.yaml
