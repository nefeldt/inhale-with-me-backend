name: Build & Deploy to mittwald

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push image to GitHub Container Registry (GHCR)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to mittwald Container Hosting
        uses: mittwald/deploy-container-action@v1
        env:
          # First produced tag, e.g. ghcr.io/owner/repo:sha-abc123
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          api_token: ${{ secrets.MITTWALD_API_TOKEN }}
          # Accept the (non-sensitive) stack id from either the Secrets or Variables tab.
          stack_id: ${{ secrets.MITTWALD_STACK_ID || vars.MITTWALD_STACK_ID }}
          stack_file: ${{ github.workspace }}/deploy/stack.yaml
