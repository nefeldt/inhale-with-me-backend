# mittwald Container Hosting stack definition, consumed by
# mittwald/deploy-container-action. The whole file is rendered as a Go template,
# so ".Env.NAME" placeholders below are filled from the deploy step's env: block
# (see .github/workflows/deploy.yml) and real secrets never live in this file.
# NOTE: do not write template braces in comments — they are rendered too.
services:
  api:
    description: "Inhale With Me REST API"
    # Full image reference (registry/owner/repo:tag) provided by CI.
    image: "{{ .Env.IMAGE_TAG }}"
    ports:
      - "8080/tcp"
    envs:
      ENVIRONMENT: "production"
      PORT: "8080"
      DB_PATH: "/data/inhale.db"
      JWT_SECRET: "{{ .Env.JWT_SECRET }}"
      CORS_ALLOWED_ORIGINS: "*"
      APNS_BUNDLE_ID: "feldt.systems.Inhale-With-Me"
      APNS_PRODUCTION: "{{ .Env.APNS_PRODUCTION }}"
      APNS_KEY_ID: "{{ .Env.APNS_KEY_ID }}"
      APNS_TEAM_ID: "{{ .Env.APNS_TEAM_ID }}"
      APNS_KEY_P8_BASE64: "{{ .Env.APNS_KEY_P8_BASE64 }}"
    volumes:
      # Persist the SQLite database across container recreations/redeploys.
      - "inhale-data:/data"

volumes:
  inhale-data:
    name: inhale-data
